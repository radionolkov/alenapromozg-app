# Мини-приложение «Мозг» (Задача 20). Всё — с одного адреса: страница, копия скрипта Telegram и отправка ответов
# теста в n8n. Браузеру человека не нужны ни telegram.org, ни n8n.alenapromozg.ru — у части провайдеров в России они
# не открываются. Работает одинаково напрямую через Railway и через прокси в России (он пересылает всё как есть).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /telegram-web-app.js {
        add_header Cache-Control "public, max-age=3600";
    }

    # Ответы теста («Тест 2») и «Получить результат» — в те же вебхуки n8n, что и раньше. Адрес n8n перечитывается
    # не реже раза в минуту (граница Railway может сменить адреса), поэтому proxy_pass — через переменную.
    location ~ ^/webhook/(mozg-test2|mozg-result)$ {
        limit_except POST { deny all; }
        resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $n8n_host n8n.alenapromozg.ru;
        proxy_pass https://$n8n_host;
        proxy_http_version 1.1;
        proxy_set_header Host $n8n_host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name $n8n_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        client_max_body_size 16k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
